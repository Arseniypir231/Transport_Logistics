services:
  postgres:
    image: postgres:16-alpine
    container_name: transport-logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transport_logistics
    ports:
      - "5432:5432"
    volumes:
      - transport_logistics_pg:/var/lib/postgresql/data

volumes:
  transport_logistics_pg:
